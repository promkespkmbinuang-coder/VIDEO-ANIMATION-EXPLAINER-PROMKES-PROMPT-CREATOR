name: validate-package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validator and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Strict package and traceability validation
        run: python scripts/validate_package.py --summary-json build/static-validation.json
      - name: Check release manifests, duplicate JSON keys and version documents
        run: python scripts/validate_release_consistency.py --root .
      - name: Reproducible V4 unit and adversarial tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider --junitxml=build/v4-junit.xml
      - name: Validate V4.1.7 motion and platform adapter contracts
        run: python scripts/validate_motion_contract.py
      - name: Validate V4.1.8 beat-sheet and risk contracts
        run: |
          python scripts/validate_beat_sheet.py examples/v4/beat-sheet-example.json
          python scripts/validate_risk_assessment.py examples/v4/risk-assessment-r1-example.json
      - name: Validate V4 project contracts and semantics
        run: >-
          python scripts/v4_gate_engine.py validate examples/v4/smoke-project.json
          --schema-dir schemas/v4 --report build/v4-static-validation.json
      - name: Execute every active V4 control
        run: >-
          python scripts/v4_gate_engine.py run-controls examples/v4/smoke-project.json
          --report build/v4-controls.json
          --updated-project build/v4-evidenced-project.json
      - name: Require all pre-release gates to pass
        run: >-
          python scripts/v4_gate_engine.py gate build/v4-evidenced-project.json
          --target G6_CODE_VALID --report build/v4-pre-release-gates.json
      - name: Generate candidate-control index (not execution)
        run: python scripts/generate_v4_control_candidates.py --output build/v4-control-candidates.json
      - name: Risk-triage 1,000 candidate controls (heuristic only; no test execution)
        run: python scripts/v4_control_risk_triage.py --input build/v4-control-candidates.json --output build/v4-control-risk-triage.json
      - name: Exercise CLI fail-closed behavior on blocked fixture
        shell: bash
        run: |
          set +e
          python scripts/v4_gate_engine.py gate build/v4-evidenced-project.json \
            --target G7_RELEASE_APPROVED --report build/v4-release-gate.json
          result=$?
          set -e
          test "$result" -eq 2
          python - <<'PY'
          import json
          with open('build/v4-release-gate.json', encoding='utf-8') as f:
              report = json.load(f)
          assert report['overall'] == 'BLOCKED'
          assert report['gates'][-1]['status'] == 'BLOCKED'
          assert any('TEST_FIXTURE' in reason for reason in report['gates'][-1]['reasons'])
          print('PASS: synthetic fixture is prohibited from production release')
          PY
      - name: Upload reproducible validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: promkes-v4-evidence-${{ github.sha }}
          path: |
            build/static-validation.json
            build/v4-junit.xml
            build/v4-static-validation.json
            build/v4-controls.json
            build/v4-evidenced-project.json
            build/v4-pre-release-gates.json
            build/v4-release-gate.json
            build/v4-control-candidates.json
            build/v4-control-risk-triage.json
          if-no-files-found: error
