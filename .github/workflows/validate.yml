name: validate-package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Strict package and traceability validation
        run: python scripts/validate_package.py --summary-json build/static-validation.json
      - name: Upload static validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-validation-${{ github.sha }}
          path: build/static-validation.json
          if-no-files-found: error
